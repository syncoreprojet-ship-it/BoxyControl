<style>
/* v7.0.14-rc1 — navigation UI only; no data or permission authority. */
#academy-home-content[data-aca-space]:not([data-aca-space="home"]) > :is(.academy-hero,.academy-stats,#academy-message,#bxct-aca-hub-grid){display:none!important}
#academy-home-content.academy-lookup-mode > #academy-lookup-panel{display:block}

#bxct-aca-hub-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:16px 0 24px}

#bxct-aca-hub-grid .aca-hub-card:hover:not(:disabled){border-color:var(--aca-color);background:#fbfefc}
#bxct-aca-hub-grid .aca-hub-card:disabled{cursor:not-allowed;opacity:.72}
#bxct-aca-hub-grid .aca-hub-icon{display:grid;place-items:center;flex:0 0 48px;height:48px;border-radius:14px;background:var(--aca-bg);color:var(--aca-color)}

#bxct-aca-hub-grid .aca-hub-state{font-size:11px;color:#795519;font-weight:600}
#bxct-aca-hub-grid .aca-hub-arrow{width:15px;height:15px;flex:none;color:#627f6b;fill:none;stroke:currentColor;stroke-width:1.8}

#bxct-aca-hub-header button{min-height:44px}
#bxct-aca-hub-catalogue,#bxct-aca-hub-sessions{min-width:0}
#bxct-aca-hub-grid [data-aca-module="catalogue"],#bxct-aca-hub-grid [data-aca-module="encaissements"]{--aca-color:#16834b;--aca-bg:#e1f5e9}
#bxct-aca-hub-grid [data-aca-module="inscriptions"],#bxct-aca-hub-grid [data-aca-module="statistiques"]{--aca-color:#3068bd;--aca-bg:#e6efff}
