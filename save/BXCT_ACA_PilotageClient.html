<script>
window.BXCT_ACA_FINAL_UI=(()=>{
 const $=id=>document.getElementById('bxct-aca-final-'+id),root=$('ui');let mode='',seq=0,preview=null,page=1,historyCode='',busy=false;
 const msg=x=>$('status').textContent=x,el=(tag,t)=>{const n=document.createElement(tag);n.textContent=t;return n;};
 function reset(){seq++;mode='';preview=null;busy=false;page=1;historyCode='';root.hidden=true;$('att').hidden=$('stats').hidden=$('certificate').hidden=$('history-page').hidden=true;$('code').value='';for(const k of ['metrics','finance','formation-list','certificate-text','history'])$(k).replaceChildren();$('save').disabled=true;msg('');}
 function send(api,body,done){const n=++seq,t=idToken,k=mode;busy=true;const finish=r=>{if(n!==seq||t!==idToken||k!==mode||root.hidden)return;busy=false;done(r);};
  if(previewMode){finish({ok:false,message:'Mode démonstration : aucune donnée réelle ni attestation.'});return;}if(!t){finish(null);return;}const run=google.script.run.withSuccessHandler(finish).withFailureHandler(()=>finish(null));if(api==='stats')run.BXCT_ACA_PILOTAGE_LIRE(t);else if(api==='preview')run.BXCT_ACA_ATTESTATION_APERCU(t,body);else if(api==='save')run.BXCT_ACA_ATTESTATION_ENREGISTRER(t,body);else if(api==='history')run.BXCT_ACA_ATTESTATION_HISTORIQUE(t,body);}
 function cards(target,pairs){const g=$(target);g.replaceChildren();for(const [name,value] of pairs){const a=document.createElement('article');a.append(el('small',name),el('strong',String(value)));g.append(a);}}
 function stats(){if(busy)return;msg('Chargement des sources…');$('metrics').replaceChildren();$('finance').replaceChildren();$('formation-list').replaceChildren();send('stats',null,r=>{if(!r?.ok){msg(r?.message||'Sources indisponibles.');return;}const d=r.data,s=d.sessions,t=d.dossiers;cards('metrics',[['Formations au catalogue',d.catalogue],['Sessions en cours',s.actives],['Sessions à venir',s.avenir],['Sessions archivées',s.archives],['Confirmés CONTROL',t.confirmees],['Demandes à traiter',t.aTraiter],['À affecter (dont à traiter)',t.aAffecter],['Liste d’attente',t.listeAttente]]);
  const f=d.finances,fc=x=>Number(x).toLocaleString('fr-FR')+' FCFA';if(f)cards('finance',[['Net encaissé',fc(f.netFcfa)],['Solde à payer',fc(f.soldeFcfa)],['Versements en attente',fc(f.versementsAttenteFcfa)],['Remboursements en attente',fc(f.remboursementsAttenteFcfa)]]);else $('finance').append(el('small','Registre financier indisponible — aucun montant supposé.'));
  for(const x of d.formations){const a=document.createElement('article');a.append(el('strong',x.titre),el('small',x.sessions+' session(s) · '+x.actives+' en cours · '+x.avenir+' à venir · '+x.archives+' archivées'),el('small',x.confirmes+' confirmé(s) · '+x.aTraiter+' à traiter · '+x.attente+' en attente'));$('formation-list').append(a);}if(!d.formations.length)$('formation-list').append(el('small','Aucune session enregistrée.'));msg(d.mode+' · '+d.date+' UTC · lecture seule');});}
 function clearPreview(){preview=null;$('certificate').hidden=true;$('certificate-text').replaceChildren();$('save').disabled=true;}
 function renderCertificate(d){const p=d.progression,box=$('certificate-text');box.replaceChildren();for(const x of [d.nom,d.formation,'Session : '+d.session,'Période : '+d.debut+' — '+d.fin,'Présences : '+p.presences+' · Retards : '+p.retards,'Absences : '+p.absences+' · Excusées : '+p.excusees,'Séances renseignées : '+p.renseignees+'/'+p.prevues,'Taux de présence (retards inclus) : '+p.tauxPresence+' %'])box.append(el('p',x));$('certificate').hidden=false;$('save').disabled=!d.canWrite;}
 function showPreview(){if(busy)return;clearPreview();$('history').replaceChildren();$('history-page').hidden=true;msg('Vérification du dossier…');send('preview',{code:$('code').value},r=>{if(!r?.ok){msg(r?.message||'Bilan indisponible.');return;}preview=r.data;renderCertificate(preview);msg(r.message);});}
 function history(){if(busy)return;clearPreview();$('history').replaceChildren();$('history-page').hidden=true;msg('Chargement de l’historique TEST…');send('history',{code:historyCode,page},r=>{if(!r?.ok){msg(r?.message||'Historique indisponible.');return;}for(const d of r.data.items){const a=document.createElement('article');a.append(el('strong',d.formation),el('small',d.session),el('small',d.date+' · '+d.id));if(d.snapshot){const b=el('button','Voir ce brouillon historique');b.type='button';b.onclick=()=>{preview=null;renderCertificate({...d.snapshot,canWrite:false});msg('Version historique TEST · '+d.id);};a.append(b);}$('history').append(a);}if(!r.data.items.length)$('history').append(el('small','Aucun brouillon enregistré.'));$('history-page').hidden=!r.data.total;$('page-info').textContent='Page '+page+' / '+Math.max(1,Math.ceil(r.data.total/10));$('prev').disabled=page<=1;$('next').disabled=page*10>=r.data.total;msg(r.message);});}
 $('refresh').onclick=stats;$('att-form').onsubmit=e=>{e.preventDefault();showPreview();};$('code').oninput=()=>{seq++;busy=false;clearPreview();$('history').replaceChildren();$('history-page').hidden=true;msg('');};$('save').onclick=()=>{if(busy||!preview?.canWrite||!confirm('Enregistrer ce brouillon non officiel dans le registre TEST ?'))return;$('save').disabled=true;msg('Enregistrement…');send('save',{code:preview.code,hash:preview.hash},r=>{msg(r?.message||'Résultat incertain. Réessayez le même brouillon.');if(!r?.ok)$('save').disabled=false;else msg(r.message+' Réf. '+r.data.id);});};$('history-open').onclick=()=>{if(busy)return;historyCode=$('code').value;page=1;history();};$('prev').onclick=()=>{if(!busy&&page>1){page--;history();}};$('next').onclick=()=>{if(!busy){page++;history();}};
 return {reset,open(k){reset();mode=k;root.hidden=false;$('stats').hidden=k!=='statistiques';$('att').hidden=k!=='attestations';if(k==='statistiques')stats();}};
})();
</script>
