<script>
window.BXCT_ACA_SESSION_UI=(()=>{
 'use strict';const $=id=>document.getElementById('bxct-aca-session-'+id),form=$('form'),change=$('changeform'),lesson=$('seanceform'),assign=$('assignform');
 let assignSeq=0,assignBusy=false;let summarySeq=0;let filter={group:'actives',formation:'',q:'',year:'',page:1},seq=0,pending=null,active=false,selected=null;
 const msg=t=>$('msg').textContent=t;
 const resetFilter=()=>{filter={group:'actives',formation:'',q:'',year:'',page:1};$('search').value='';$('year').replaceChildren(new Option('Toutes',''));};
 function lockFields(f,v){for(const e of f.elements)e.disabled=v;f.querySelector('[type=submit]').disabled=v;}
 function cleanForms(){assignSeq++;assignBusy=false;for(const f of [form,change,lesson,assign]){lockFields(f,false);f.reset();f.hidden=true;}selected=null;}
 function reset(){active=false;seq++;summarySeq++;if(!pending||pending.token!==idToken||!idToken){pending=null;cleanForms();}else{form.hidden=true;change.hidden=true;lesson.hidden=true;assign.hidden=true;} $('new').disabled=true;$('groups').replaceChildren();$('page').hidden=true;resetFilter();}
 function current(n,t){return active&&n===seq&&t===idToken&&document.getElementById('academy-home-content').dataset.acaSpace==='sessions';}
 function text(tag,t){const e=document.createElement(tag);e.textContent=t;return e;}
 function demo(){const rows=[{code_session:'SES-DEMO',titre_session:'Création de contenu (simulation)',date_debut:'2027-01-16',date_fin:'2027-01-17',capacite_max:'12',statut_session:'BROUILLON',validation_session:'A_VALIDER',visible_public:'NON',aTraiter:0,confirmesControl:0,attenteControl:0}];return {ok:true,data:{counts:{actives:0,avenir:1,archives:0},groups:filter.group==='avenir'?[{code:'DEMO',titre:'Création de contenu (simulation)',total:1}]:[],sessions:filter.group==='avenir'&&filter.formation==='DEMO'?rows:[],page:1,total:filter.group==='avenir'&&filter.formation==='DEMO'?1:0,years:['2027'],formations:[],canCreate:false}};}
 const actions={PLANIFIER:'Planifier',REPASSER_BROUILLON:'Repasser en brouillon',OUVRIR:'Valider et ouvrir les inscriptions (TEST)',ANNULER:'Annuler la session',DATES:'Modifier les dates',FERMER:'Fermer les inscriptions',DEMARRER:'Démarrer la session',TERMINER:'Terminer la session'};
 const status={BROUILLON:'Brouillon',ANNONCEE:'Planifiée',OUVERTE:'Inscriptions ouvertes',COMPLETE:'Complète',FERMEE:'Inscriptions fermées',EN_COURS:'En cours',TERMINEE:'Terminée',ANNULEE:'Annulée',ARCHIVEE:'Archivée'};
 function showDates(){const on=change.elements.action.value==='DATES';$('changedates').hidden=!on;change.elements.debut.required=change.elements.fin.required=on;}
 function edit(s){if(pending||assignBusy)return;cleanForms();selected=s;change.hidden=false;$('changetitle').textContent=s.titre_session+' · '+s.code_session;const opts=({BROUILLON:['PLANIFIER','DATES','ANNULER'],ANNONCEE:['OUVRIR','REPASSER_BROUILLON','DATES','ANNULER'],OUVERTE:['FERMER'],COMPLETE:['FERMER'],FERMEE:['DEMARRER'],EN_COURS:['TERMINER']})[s.statut_session]||[];change.elements.action.replaceChildren(...opts.map(k=>new Option(actions[k],k)));change.elements.debut.value=s.date_debut;change.elements.fin.value=s.date_fin;showDates();change.elements.action.focus();}
 function editLesson(s){if(pending||assignBusy)return;cleanForms();selected=s;lesson.hidden=false;$('seancetitle').textContent=s.titre_session+' · '+s.code_session;lesson.elements.date.min=s.date_debut;lesson.elements.date.max=s.date_fin;lesson.elements.date.value=s.date_debut;lesson.elements.date.focus();}
 function editAssign(s){if(pending||assignBusy)return;cleanForms();selected=s;assign.hidden=false;$('assigntitle').textContent=s.titre_session+' · '+s.code_session;const n=++assignSeq,t=idToken;assign.elements.agentId.replaceChildren(new Option('Choisir un formateur',''));assign.querySelector('[type=submit]').disabled=true;$('assignstatus').textContent='Chargement…';if(previewMode||!t){$('assignstatus').textContent='Recette TEST connectée requise.';return;}
  google.script.run.withSuccessHandler(r=>{if(n!==assignSeq||t!==idToken||assign.hidden||!active)return;if(!r?.ok){$('assignstatus').textContent=r?.message||'Indisponible.';return;}if(r.data.current){$('assignstatus').textContent='Affecté : '+r.data.current.name;return;}assign.elements.agentId.replaceChildren(new Option('Choisir un formateur',''),...r.data.agents.map(a=>new Option(a.name,a.id)));$('assignstatus').textContent=r.data.agents.length?'Aucun formateur affecté.':'Aucun agent FORMATEUR actif.';assign.querySelector('[type=submit]').disabled=!r.data.agents.length;}).withFailureHandler(()=>{if(n===assignSeq&&t===idToken&&!assign.hidden)$('assignstatus').textContent='Lecture indisponible.';}).BXCT_ACA_FORMATEURS_LIST(t,{code:s.code_session});}
 function updateCounts(d){if(Number.isInteger(d.totalFormations))document.getElementById('academy-formations-count').textContent=String(d.totalFormations);if(Number.isInteger(d.totalSessions))document.getElementById('academy-sessions-count').textContent=String(d.totalSessions);}
 function summary(){const n=++summarySeq,t=idToken;if(previewMode){updateCounts({totalFormations:1,totalSessions:1});return;}if(!academyAccess||!t){academyBoardSetCounts(null);return;}const done=r=>{if(n!==summarySeq||t!==idToken||academyActivity!=='academie')return;if(r?.ok){updateCounts(r.data);academyNotice('Catalogue et sessions officiels · ouvrez un module pour les consulter.');}else{academyBoardSetCounts(null);academyNotice('Lecture ACADÉMIE indisponible ou non autorisée.','warning');}};google.script.run.withSuccessHandler(done).withFailureHandler(()=>done(null)).BXCT_ACA_SESSION_LIST(t,{group:'actives',formation:'',q:'',year:'',page:1});}
 function render(d){
  updateCounts(d);  $('new').disabled=!!pending||!d.canCreate||!d.formations.length;
  if(!pending){const prev=form.elements.formation.value;form.elements.formation.replaceChildren(new Option('Choisir une formation',''),...d.formations.map(x=>new Option(x.titre,x.code)));if(d.formations.some(x=>x.code===prev))form.elements.formation.value=prev;}
  $('year').replaceChildren(new Option('Toutes',''),...d.years.map(x=>new Option(x,x)));$('year').value=filter.year;
  $('tabs').querySelectorAll('button').forEach(b=>{const k=b.dataset.sessionGroup;b.setAttribute('aria-pressed',String(k===filter.group));b.textContent=({actives:'En cours',avenir:'À venir',archives:'Archives'})[k]+' ('+d.counts[k]+')';});
  const list=$('groups');list.replaceChildren();$('page').hidden=true;
  if(!d.groups.length){list.append(text('small','Aucune session dans cette catégorie.'));return;}
  d.groups.forEach(g=>{const b=text('button',g.titre+' · '+g.total+' session(s)');b.type='button';b.className='aca2-group';b.setAttribute('aria-expanded',String(filter.formation===g.code));b.onclick=()=>{filter.formation=filter.formation===g.code?'':g.code;filter.page=1;load();};list.append(b);
   if(filter.formation!==g.code)return;d.sessions.forEach(s=>{const item=document.createElement('article');item.className='aca2-session';item.append(text('strong',s.titre_session),text('small',s.code_session),text('span',s.date_debut+' — '+s.date_fin),text('small','Capacité : '+s.capacite_max+' · Confirmés : '+s.confirmesControl+' · À traiter : '+s.aTraiter+' · Attente : '+s.attenteControl),text('small',(status[s.statut_session]||s.statut_session)+' · '+s.validation_session+(s.visible_public==='OUI'?'':' · Non publiée')));
    if(s.seances?.length){const details=document.createElement('details');details.append(text('summary',s.seances.length+' séance(s)'));const lessons=document.createElement('div');lessons.style.maxHeight='240px';lessons.style.overflowY='auto';for(const x of s.seances)lessons.append(text('p','Séance '+x.numero_seance+' · '+x.date_seance+' · '+x.heure_debut+'–'+x.heure_fin+' · '+x.activite+' · '+x.validation));details.append(lessons);item.append(details);}
    const prep=['BROUILLON','ANNONCEE'].includes(s.statut_session)&&s.validation_session==='A_VALIDER'&&s.visible_public==='NON',life=['OUVERTE','COMPLETE','FERMEE','EN_COURS'].includes(s.statut_session)&&s.validation_session==='VALIDEE';
    if(d.canCreate&&/^SES-[A-F0-9]{32}$/.test(s.code_session)&&(prep||life)){const editBtn=text('button','Gérer cette session');editBtn.type='button';editBtn.disabled=!!pending;editBtn.onclick=()=>edit(s);item.append(editBtn);if(prep||['OUVERTE','COMPLETE','FERMEE'].includes(s.statut_session)){const b=text('button','Ajouter une séance');b.type='button';b.disabled=!!pending;b.onclick=()=>editLesson(s);item.append(b);}if(s.statut_session!=='EN_COURS'){const a=text('button','Formateur responsable');a.type='button';a.disabled=!!pending||assignBusy;a.onclick=()=>editAssign(s);item.append(a);}}list.append(item);});
  });
  if(filter.formation&&d.total){filter.page=d.page;$('page').hidden=false;$('pageinfo').textContent='Page '+d.page+' / '+Math.ceil(d.total/10);$('prev').disabled=d.page<=1;$('next').disabled=d.page*10>=d.total;}
 }
 function load(){if(!active)return;const n=++seq,t=idToken;msg('Chargement des sessions…');$('groups').replaceChildren();$('page').hidden=true;$('new').disabled=true;
  const done=r=>{if(!current(n,t))return;if(!r?.ok){msg(r?.message||'Lecture indisponible.');return;}render(r.data);msg(pending?'Une opération est en attente de confirmation. Réessayez sans modifier la demande.':previewMode?'Simulation — aucune écriture.':r.data.canCreate?'Gestion TEST : création autorisée si CLIENT est configuré.':'Consultation seule — création verrouillée.');};
  if(previewMode){done(demo());return;}if(!t){msg('Reconnectez-vous.');return;}google.script.run.withSuccessHandler(done).withFailureHandler(()=>done(null)).BXCT_ACA_SESSION_LIST(t,filter);
 }
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter.group=b.dataset.sessionGroup;filter.formation='';filter.page=1;load();});
 $('filter').onclick=()=>{filter.q=$('search').value.trim();filter.year=$('year').value;filter.formation='';filter.page=1;load();};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('filter').click();}});$('year').onchange=()=>$('filter').click();$('prev').onclick=()=>{filter.page--;load();};$('next').onclick=()=>{filter.page++;load();};
 $('new').onclick=()=>{if(pending||assignBusy)return;change.hidden=true;lesson.hidden=true;assign.hidden=true;assignSeq++;form.hidden=false;form.elements.formation.focus();};
 $('cancel').onclick=()=>{if(!pending){form.hidden=true;form.reset();}};$('changeclose').onclick=()=>{if(!pending){change.hidden=true;selected=null;}};change.elements.action.onchange=showDates;$('assignclose').onclick=()=>{if(!assignBusy){assignSeq++;assign.hidden=true;selected=null;}};assign.onsubmit=e=>{e.preventDefault();if(assignBusy||!active||!selected||previewMode||!idToken||!assign.elements.agentId.value||!confirm('Affecter ce formateur responsable ?'))return;assignBusy=true;const n=++assignSeq,t=idToken,code=selected.code_session,agentId=assign.elements.agentId.value;assign.querySelector('[type=submit]').disabled=true;$('assignstatus').textContent='Enregistrement…';const done=r=>{if(n!==assignSeq||t!==idToken||assign.hidden)return;assignBusy=false;$('assignstatus').textContent=r?.message||'Résultat incertain. Réessayez la même affectation.';if(!r?.ok)assign.querySelector('[type=submit]').disabled=false;};google.script.run.withSuccessHandler(done).withFailureHandler(()=>done(null)).BXCT_ACA_FORMATEUR_AFFECTER(t,{code,agentId});};$('seanceclose').onclick=()=>{if(!pending){lesson.hidden=true;selected=null;}};
 function prepare(f,kind){if(pending)return pending;if(!window.crypto?.getRandomValues){msg('Générateur sécurisé indisponible.');return null;}const key=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(),b=Object.fromEntries(new FormData(f));b.key=key;
  if(kind==='create')b.capacite=Number(b.capacite);else if(kind==='seance'){if(!selected)return null;b.code=selected.code_session;}else {if(!selected)return null;b.code=selected.code_session;b.expected=selected.statut_session;b.expectedDebut=selected.date_debut;b.expectedFin=selected.date_fin;if(['OUVRIR','ANNULER','FERMER','DEMARRER','TERMINER'].includes(b.action)&&!window.confirm(actions[b.action]+' ? Cette action sera journalisée.'))return null;}
  pending={token:idToken,kind,body:b,form:f,busy:false};return pending;
 }
 function execute(f,kind){if(previewMode||!active||!idToken)return;const p=prepare(f,kind);if(!p||p.busy||p.kind!==kind||p.token!==idToken)return;p.busy=true;lockFields(f,true);$('new').disabled=true;msg('Enregistrement en cours…');
  const done=r=>{if(pending!==p||p.token!==idToken)return;p.busy=false;
   if(r?.ok){pending=null;cleanForms();if(active){filter.group=({ANNULEE:'archives',TERMINEE:'archives',EN_COURS:'actives'})[r.data?.statut]||'avenir';filter.formation='';filter.page=1;filter.year='';filter.q='';$('search').value='';load();}return;}
   const definitive=r?.code&&(r.code==='OPERATION_CONTROL_REFUSEE'||/^BXCL_L8_SESSION_(INVALIDE|FORMATION_FERMEE|FERMEE|LIMITE|TRANSITION_REFUSEE|ETAT_CHANGE|DOSSIERS_PRESENTS|HISTORIQUE_PROTEGEE|INCONNUE|SOURCE_MODIFIEE|CHEVAUCHEMENT|SEANCES_HORS_DATES)$/.test(r.code));
   if(definitive){pending=null;lockFields(f,false);}else f.querySelector('[type=submit]').disabled=false;
   if(active)msg(r?.message||'Résultat incertain : réessayez la même demande.');
  };
  const run=google.script.run.withSuccessHandler(done).withFailureHandler(()=>done(null));if(kind==='create')run.BXCT_ACA_SESSION_CREATE(p.token,p.body);else if(kind==='seance')run.BXCT_ACA_SESSION_SEANCE(p.token,p.body);else run.BXCT_ACA_SESSION_CHANGE(p.token,p.body);
 }
 for(const [f,k] of [[form,'create'],[change,'change'],[lesson,'seance']])f.addEventListener('submit',e=>{e.preventDefault();execute(f,k);});
 return {open(){reset();active=true;if(pending){pending.form.hidden=false;pending.form.querySelector('[type=submit]').disabled=pending.busy;}load();},reset,summary};
})();
</script>
