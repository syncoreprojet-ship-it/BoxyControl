<!-- BOXY CONTROL LOGIN | CSS autonome, format mini -->
<style>
/* LOGIN INITIAL v7.0.5 - format compact et accessible sur petit viewport */
#auth-panel .bx-login-stage{display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - 95px);padding:22px 0 34px}
#auth-panel .bx-login-mini{width:min(100%,328px);margin:0;padding:21px;border-radius:19px;box-shadow:0 10px 35px rgba(21,95,63,.07)}
#auth-panel .bx-login-heading{display:flex;align-items:center;gap:10px;min-width:0}
#auth-panel .bx-login-symbol{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:#e6f8ed;color:#14865b}
#auth-panel .bx-login-symbol svg{width:17px;height:17px}
#auth-panel .bx-login-heading h1{font-size:19px;line-height:1.2;letter-spacing:-.3px;margin:0;font-weight:800}
#auth-panel .bx-login-heading p{font-size:11px;line-height:1.35;margin:3px 0 0;color:#6d897b}
#auth-panel .bx-login{display:grid;gap:10px;margin-top:17px}
#auth-panel .bx-login label{display:block;font-size:11px;font-weight:750;color:#385c49;margin-bottom:5px}
#auth-panel .bx-login input{height:43px;width:100%;min-width:0;border-radius:10px;border:1px solid #cddfd2;background:#fcfffd;padding:9px 11px;font-size:16px;color:#153d2a;outline:0}
#auth-panel .bx-login input:focus-visible{border-color:#14865b;box-shadow:0 0 0 3px rgba(20,134,91,.12)}
#auth-panel .bx-login button[type="submit"]{min-height:44px;width:100%;border:0;background:#147b53;color:#fff;border-radius:10px;font-weight:770;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:3px}
#auth-panel .bx-login button[type="submit"] svg{width:17px;height:17px}
#auth-panel .bx-login button:disabled{opacity:.62}
#auth-panel .bx-login-notice{font-size:10px;color:#668776;line-height:1.45;margin:0}
#auth-panel .bx-login-back{background:transparent;color:#517762;border:0;padding:7px 10px;min-height:40px;border-radius:10px;font-weight:700;font-size:12px}
#auth-panel #bx-preview-entry{border-top:1px solid #e3eee7;margin-top:14px;padding-top:5px}
#auth-panel #preview-login{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin:0;padding:8px 9px;min-height:42px;background:transparent;border:0;border-radius:10px;color:#14865b;font-size:12px;font-weight:750}
#auth-panel #preview-login:hover,#auth-panel #preview-login:focus-visible{background:#f0fbf3}
#auth-panel #preview-login svg{width:16px;height:16px}
#auth-panel .bx-login-demo-note{font-size:10px;color:#7b9384;text-align:center;line-height:1.4}
#auth-panel #login-status{margin-top:12px;padding:9px 10px;border-radius:10px;font-size:11px}
@media (max-width:350px){#auth-panel .bx-login-mini{padding:17px}#auth-panel .bx-login-stage{padding:14px 0 22px}}
@media (max-height:620px){#auth-panel .bx-login-stage{min-height:calc(100dvh - 90px);padding:12px 0 20px}}
</style>
