<!-- BOXY CONTROL PARAMETRES | style indépendant mobile first -->
<style>
.bx-param{display:grid;gap:14px;min-width:0;padding-bottom:32px}
.bx-param-head{margin-top:15px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.bx-param-head h2{font-size:20px;margin:6px 0}
.bx-param-head p{font-size:11px;line-height:1.5}
.bx-param-state{font-size:10px;font-weight:780;border-radius:99px;padding:7px 9px;background:#e8f8eb;color:#18794a;white-space:nowrap}
.bx-param-header-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bx-param-retry{justify-self:start}
.bx-param-summary{display:flex;gap:8px;flex-wrap:wrap}.bx-param-summary span{border:1px solid #dbedde;border-radius:11px;background:white;padding:9px 12px;font-size:12px;color:#486c57}.bx-param-summary strong{color:#14744d}
.bx-param-card{background:#fff;border:1px solid #dceee1;border-radius:17px;padding:14px;min-width:0}
.bx-param-card-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:13px;font-size:13px}
.bx-param-link{background:#f0fbf2;color:#178352;border:1px solid #d4ead9;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:760;min-height:36px}
#bx-param-form{display:grid;gap:7px}
#bx-param-form>label:not(.bx-param-checkbox){font-size:11px;font-weight:750;color:#476c55;margin-top:4px}
#bx-param-form>input:not([type=hidden]),#bx-param-form select{width:100%;min-width:0;height:43px;padding:9px 11px;border:1px solid #cbded2;border-radius:11px;background:#fff;color:#234c36;font-size:16px}
.bx-param-checkbox{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:#4b6f59}.bx-param-checkbox input{width:17px;height:17px;accent-color:#14865b}
.bx-param-primary{background:#14865b;color:white;border:0;border-radius:11px;min-height:44px;font-size:12px;font-weight:770;margin-top:4px}
.bx-param-primary:disabled{opacity:.6}
.bx-param-hint{font-size:11px;line-height:1.5;color:#6e8876;margin:8px 0 0}
.bx-param-list{display:grid;gap:8px;min-width:0}
.bx-param-user{border:1px solid #e2efe6;border-radius:12px;padding:11px;display:flex;gap:8px;align-items:center;min-width:0}
.bx-param-user-main{flex:1;min-width:0}.bx-param-user-main strong{display:block;line-height:1.4;font-size:12px;overflow-wrap:anywhere}.bx-param-user-main small{display:block;color:#6b8977;font-size:10px;margin-top:3px;overflow-wrap:anywhere}
.bx-param-user .bx-param-link{flex:none}
.bx-param-flag{font-size:10px;border-radius:9px;padding:5px 7px;background:#eaf8ef;color:#137a4d;font-weight:760}.bx-param-flag.off{background:#f4f4f3;color:#70776e}
.bx-param-roles-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bx-param-role{border:1px solid #dcefe0;border-radius:10px;padding:7px;background:#f8fdf8;color:#416d51;font-size:10px;font-weight:700}
.bx-param [hidden]{display:none!important}

#bx-param-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:15px}
#bx-param-content .bx-param-summary,#bx-param-content .bx-param-roles{grid-column:1/-1}
#bx-param-content .bx-param-card{height:auto;min-height:0}
.bx-param{padding-bottom:40px}
.bx-param-link{cursor:pointer}
@media(max-width:980px){#bx-param-content{grid-template-columns:minmax(0,1fr)}}
@media(max-width:350px){.bx-param-card{padding:11px}.bx-param-head h2{font-size:18px}.bx-param-user{padding:9px}}

/* Mot de passe admin : formulaire compact sous le compte, sans modal coupee. */
.bx-param-secret-form{display:grid;gap:8px;padding:12px;border:1px solid #d7eadc;border-radius:12px;background:#f7fcf8;min-width:0;margin-top:12px}
.bx-param-secret-form>label{font-size:11px;font-weight:760;color:#476c55}
.bx-param-secret-form>input{width:100%;min-width:0;height:43px;padding:9px 11px;border:1px solid #cbded2;border-radius:11px;font-size:16px;background:#fff}
.bx-param-secret-form .bx-param-hint{margin:0 0 5px}
.bx-param-password-status{color:#678b75}
.bx-param-secret-form[hidden]{display:none!important}
@media(max-width:420px){.bx-param-user{flex-wrap:wrap}.bx-param-user .bx-param-link{margin-left:auto}}

</style>


<style>
.bx-param-activation{grid-column:1/-1;border:1px solid #cce9d6;border-radius:14px;background:#f5fbf5;
 padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.bx-param-activation strong{font-size:12px;color:#17583b}
.bx-param-activation p{font-size:11px;margin:4px 0 0;line-height:1.5;color:#688974}
.bx-param-activation button{padding:9px 14px;white-space:nowrap;flex:none;margin:0}
.bx-param-user{flex-wrap:wrap}.bx-param-user-main{flex-basis:42%}
@media(max-width:540px){.bx-param-activation{align-items:stretch;flex-direction:column}
 .bx-param-activation button{width:100%}.bx-param-user-main{flex-basis:100%}
 .bx-param-user .bx-param-link{margin-left:0}}
</style>
